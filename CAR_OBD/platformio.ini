; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32doit-devkit-v1-image-dimming

[env:esp32doit-devkit-v1]
platform = espressif32@6.12.0
board = esp32doit-devkit-v1
framework = espidf
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = -Wall -Wextra

; GPIO4 backlight control. Verify the LED interface or retain current limiting.
; The base environment above retains LED -> 3V3 operation.
[env:esp32doit-devkit-v1-backlight]
extends = env:esp32doit-devkit-v1
build_flags = ${env:esp32doit-devkit-v1.build_flags} -DOBD_BACKLIGHT_PWM=1

; Seven-pin display: GPIO4 unused; test GC9A01 brightness commands over SPI.
[env:esp32doit-devkit-v1-spi-dimming]
extends = env:esp32doit-devkit-v1
build_flags = ${env:esp32doit-devkit-v1.build_flags} -DOBD_BACKLIGHT_SPI=1

; Seven-pin display: reduce rendered RGB intensity; backlight stays unchanged.
[env:esp32doit-devkit-v1-image-dimming]
extends = env:esp32doit-devkit-v1
build_flags = ${env:esp32doit-devkit-v1.build_flags} -DOBD_BACKLIGHT_IMAGE=1
